<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Logs</title>
<style>
:root{--ink:#0b0d12;--panel:#161922;--line:rgba(255,255,255,.09);--paper:#ECEEF3;--mist:#8B93A4;--brass:#C9A24B;--brass-soft:#e2c074;--danger:#E0564B;--serif:Georgia,"Times New Roman",serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--paper);font-family:var(--sans);overflow:hidden;background:#0b0d12;background-image:radial-gradient(100% 60% at 14% -4%,rgba(86,102,170,.18),transparent 50%),linear-gradient(180deg,#161b27 0%,#0e1118 55%,#0b0d12 100%)}
button{font-family:inherit;border:0;color:inherit;cursor:pointer}
.topbar{height:78px;display:flex;align-items:center;gap:10px;padding:max(18px,env(safe-area-inset-top)) 16px 10px;position:relative;z-index:2}
.title{font-family:var(--serif);font-size:29px;font-weight:600;flex:1;line-height:1.05}
.title small{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--brass);margin-bottom:2px}
.btn{background:rgba(201,162,75,.13);border:1px solid rgba(201,162,75,.42);color:#f4d58b;border-radius:14px;padding:11px 14px;font-weight:800;font-size:13px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.danger{background:rgba(224,86,75,.13);border-color:rgba(224,86,75,.42);color:#ffb3ad}
#logBox{position:absolute;left:12px;right:12px;top:88px;bottom:84px;background:rgba(7,9,14,.85);border:1px solid var(--line);border-radius:16px;padding:14px;overflow:auto;white-space:pre-wrap;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#dce2ee;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.bottom{position:absolute;left:12px;right:12px;bottom:max(16px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(20,24,34,.96);color:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 18px;z-index:9;display:none;max-width:90%;text-align:center;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.toast.on{display:block}
.empty{color:var(--mist)}
</style>
</head>
<body>
<div class="topbar">
  <div class="title"><small>Debug détaillé</small>Logs</div>
  <button id="homeBtn" class="btn">Home</button>
</div>
<pre id="logBox" class="empty">Chargement des logs...</pre>
<div class="bottom">
  <button id="copyBtn" class="btn">Copier les logs</button>
  <button id="clearBtn" class="btn danger">Vider</button>
</div>
<div id="toast" class="toast"></div>
<script src="app-logger.js"></script>
<script>
const $=id=>document.getElementById(id);
function toast(t){$('toast').textContent=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),1800)}
function render(){
  const txt=window.AppLogger ? AppLogger.text() : '';
  $('logBox').textContent = txt || 'Aucun log pour l’instant.\n\nReproduis le bug, reviens ici, puis clique sur “Copier les logs”.';
  $('logBox').classList.toggle('empty', !txt);
  $('logBox').scrollTop=$('logBox').scrollHeight;
}
$('homeBtn').onclick=()=>{AppLogger?.nav('home.html','logs home button');location.href='home.html';};
$('copyBtn').onclick=async()=>{
  const txt=AppLogger.text();
  try{ await navigator.clipboard.writeText(txt || 'Aucun log'); toast('Logs copiés'); }
  catch(e){
    const box=$('logBox'); const r=document.createRange(); r.selectNodeContents(box);
    const s=getSelection(); s.removeAllRanges(); s.addRange(r);
    try{ document.execCommand('copy'); toast('Logs copiés'); }catch(_){ toast('Copie impossible'); }
  }
};
$('clearBtn').onclick=()=>{ if(confirm('Vider tous les logs ?')){ AppLogger.clear(); AppLogger.log('Logs vidés'); render(); } };
window.addEventListener('app-log-added', render);
render();
</script>
<script src="camera-indicator.js"></script>
</body>
</html>
