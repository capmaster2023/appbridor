<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Galerie</title>
<style>
  :root{
    --ink:#0b0d12; --panel:#161922; --panel2:#1E222D; --line:rgba(255,255,255,.09);
    --mist:#8B93A4; --paper:#ECEEF3; --brass:#C9A24B; --brass-soft:#e2c074; --danger:#E0564B;
    --ok:#58d68d; --serif:Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;color:var(--paper);font-family:var(--sans);overflow:hidden;overscroll-behavior:none;
    background:#0b0d12;
    background-image:
      radial-gradient(100% 60% at 12% -4%, rgba(86,102,170,.20), transparent 50%),
      radial-gradient(120% 70% at 96% 104%, rgba(201,162,75,.12), transparent 46%),
      linear-gradient(180deg,#161b27 0%,#0e1118 52%,#0b0d12 100%);}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  .hidden{display:none!important}
  svg.gi{width:19px;height:19px;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  #gallery{position:fixed;inset:0;display:flex;flex-direction:column;min-height:0}
  .topbar{display:flex;align-items:center;gap:8px;padding:max(16px,env(safe-area-inset-top)) 14px 10px;
    position:relative;z-index:8;background:linear-gradient(180deg,rgba(14,16,20,.96),rgba(14,16,20,.55))}
  .topbar .title{font-family:var(--serif);font-size:21px;letter-spacing:.02em;flex:1;min-width:60px;line-height:1.05}
  .topbar .title small{display:block;font-family:var(--sans);font-size:9.5px;
    letter-spacing:.34em;text-transform:uppercase;color:var(--brass);margin-bottom:2px}
  .browserBtn,.wipeBtn{display:inline-flex;align-items:center;justify-content:center;gap:5px;
    border-radius:13px;padding:9px 11px;font-size:12.5px;font-weight:700;white-space:nowrap;transition:transform .08s ease,filter .12s}
  .browserBtn{background:rgba(201,162,75,.12);border:1px solid rgba(201,162,75,.4);color:#f4d58b}
  .wipeBtn{background:rgba(224,86,75,.12);border:1px solid rgba(224,86,75,.42);color:#ffb3ad}
  .browserBtn:active,.wipeBtn:active,.fab:active,.actionBtn:active,.selectAllBtn:active{transform:scale(.96);filter:brightness(1.08)}

  .galleryInfo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px 10px;color:var(--mist);font-size:12.5px;z-index:7;background:rgba(14,16,20,.55)}
  .galleryInfo b{color:var(--paper);font-weight:700}
  .selectTools{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.selectTools::-webkit-scrollbar{display:none}
  .selectAllBtn{background:rgba(255,255,255,.05);border:1px solid var(--line);color:#dfe2e8;border-radius:11px;padding:8px 11px;font-weight:600;white-space:nowrap;font-size:12px;transition:transform .08s}

  .grid{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 12px 130px;
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;
    align-content:start;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;contain:layout paint}
  .cell{width:100%;aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:var(--panel);
    position:relative;border:1px solid rgba(255,255,255,.07);box-shadow:0 6px 18px rgba(0,0,0,.28);
    opacity:0;transform:translateY(8px) scale(.99);animation:rise .32s cubic-bezier(.2,.8,.2,1) forwards;
    content-visibility:auto;contain-intrinsic-size:120px 120px;transition:transform .12s ease}
  @keyframes rise{to{opacity:1;transform:none}}
  .cell:active{transform:scale(.97)}
  .cell img,.docThumb{width:100%;height:100%;display:block;object-fit:cover;aspect-ratio:1/1}
  .cell.selected{border-color:var(--brass);box-shadow:0 0 0 2.5px rgba(201,162,75,.45),0 10px 24px rgba(0,0,0,.4)}
  .cell.selected::after{content:"";position:absolute;inset:0;background:rgba(201,162,75,.16);pointer-events:none}
  .check{position:absolute;top:8px;left:8px;z-index:4;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;
    border:1.5px solid rgba(255,255,255,.85);background:rgba(0,0,0,.4);color:#fff;font-size:15px;font-weight:900;backdrop-filter:blur(8px)}
  .cell.selected .check{background:var(--brass);border-color:var(--brass);color:#141006}
  .typeBadge{position:absolute;right:8px;bottom:8px;z-index:3;border-radius:8px;padding:3.5px 7px;font-size:9.5px;font-weight:800;letter-spacing:.05em;
    background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);color:#fff;max-width:72%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;backdrop-filter:blur(6px)}
  .vthumb,.docThumb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--mist);
    background:linear-gradient(150deg,#1d2230,#11141c);position:relative;overflow:hidden;text-align:center;padding:8px}
  .vthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.8)}
  .vthumb::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.5));pointer-events:none}
  .play{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--brass-soft);color:var(--brass-soft);display:grid;place-items:center;font-size:16px;position:relative;z-index:2;background:rgba(0,0,0,.42);padding-left:3px}
  .nm{font-size:10.5px;line-height:1.18;max-width:94%;position:relative;z-index:2;text-shadow:0 1px 4px #000;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .docIcon{font-size:30px;line-height:1;color:#aeb5c6}.docExt{font-size:11px;color:var(--brass-soft);font-weight:900;text-transform:uppercase;letter-spacing:.08em}
  .empty{grid-column:1/-1;min-height:56vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mist);gap:8px;padding:30px;text-align:center}
  .empty .big{font-family:var(--serif);font-size:23px;color:var(--paper)}

  .actionBar{position:fixed;left:12px;right:12px;bottom:max(22px,env(safe-area-inset-bottom));z-index:18;display:none;align-items:center;gap:10px;
    background:rgba(20,24,33,.9);border:1px solid rgba(201,162,75,.3);border-radius:20px;padding:11px 12px;box-shadow:0 20px 44px rgba(0,0,0,.55);backdrop-filter:blur(16px)}
  .actionBar.on{display:flex}
  .selectedCount{font-weight:900;color:var(--brass-soft);white-space:nowrap;font-size:13px}
  .actions{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.actions::-webkit-scrollbar{display:none}
  .actionBtn{border-radius:12px;padding:10px 13px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);font-size:13px;font-weight:800;white-space:nowrap;transition:transform .08s}.actionBtn.danger{background:rgba(224,86,75,.16);border-color:rgba(224,86,75,.42);color:#ffb3ad}

  .fab{position:fixed;right:18px;bottom:max(24px,env(safe-area-inset-bottom));height:56px;padding:0 24px;border-radius:28px;
    background:linear-gradient(165deg,var(--brass-soft),var(--brass));color:#1a1407;font-weight:900;font-size:16px;display:flex;align-items:center;gap:8px;
    box-shadow:0 14px 32px rgba(202,162,75,.42),inset 0 1px 0 rgba(255,255,255,.4);z-index:17}
  #status{position:fixed;left:16px;right:16px;bottom:164px;z-index:25;background:rgba(24,28,37,.97);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:13.5px;color:var(--paper);box-shadow:0 16px 34px rgba(0,0,0,.55);display:none}#status.on{display:block}#status .bar{height:6px;border-radius:3px;background:#0c0e13;overflow:hidden;margin-top:10px}#status .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brass),var(--brass-soft));transition:width .15s}#status .msg.error{color:#ffb3ad}

  .modalShade{position:fixed;inset:0;z-index:50;background:rgba(6,8,13,.66);display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(6px)}.modalShade.on{display:flex}.modal{width:min(420px,100%);background:linear-gradient(180deg,#1a2030,#141926);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 28px 64px rgba(0,0,0,.66)}.modalTitle{font-family:var(--serif);font-size:21px;margin-bottom:8px}.modalText{color:#d8dbe2;line-height:1.4;margin-bottom:18px}.modalBtns{display:flex;justify-content:flex-end;gap:10px}.modalBtn{border-radius:13px;padding:11px 16px;font-weight:800;background:rgba(255,255,255,.08);border:1px solid var(--line)}.modalBtn.danger{background:var(--danger);border-color:var(--danger);color:#fff}

  #viewer{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .25s}#viewer.on{opacity:1;pointer-events:auto}.vhead{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:max(16px,env(safe-area-inset-top)) 16px 14px;z-index:3;background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,0))}.vstage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}.vstage img,.vstage video{max-width:100%;max-height:100%;object-fit:contain;will-change:transform;transition:transform .18s ease-out}.vloading{color:var(--mist);font-size:14px;text-align:center;line-height:1.5;padding:24px}.vfoot{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;padding:18px calc(18px + env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom));z-index:3;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.6))}.vbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:13px;padding:12px 17px;font-size:15px;font-weight:600;backdrop-filter:blur(8px)}.vbtn.del{background:rgba(224,86,75,.16);border-color:rgba(224,86,75,.4);color:#ffb3ad}.vnav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.42);color:#fff;font-size:24px;display:grid;place-items:center;z-index:3;backdrop-filter:blur(6px)}.vnav.prev{left:10px}.vnav.next{right:10px}.counter{font-size:13px;color:#cfd3da;letter-spacing:.05em}
  @media(max-width:360px){.topbar{gap:6px;padding-left:11px;padding-right:11px}.browserBtn,.wipeBtn{padding:8px 9px;font-size:11.5px}.grid{gap:7px;padding-left:9px;padding-right:9px}.actionBar{left:9px;right:9px}.selectedCount{font-size:12px}.actionBtn{padding:9px 11px}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10.5V20h12v-9.5"/><path d="M10 20v-5h4v5"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="2.4"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>
  <symbol id="i-web" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.5 2.6 16.5 0 18M12 3c-2.6 2.5-2.6 16.5 0 18"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></symbol>
</defs></svg>

<section id="gallery">
  <div class="topbar">
    <div class="title"><small>Médias</small>Galerie</div>
    <button id="homeBtn" class="browserBtn" aria-label="Accueil"><svg class="gi"><use href="#i-home"/></svg></button>
    <button id="lockBtn" class="browserBtn" aria-label="Verrouiller" onclick="lockNow()"><svg class="gi"><use href="#i-lock"/></svg></button>
    <button id="browserBtn" class="browserBtn" aria-label="Navigateur"><svg class="gi"><use href="#i-web"/></svg></button>
    <button id="wipeBtn" class="wipeBtn" aria-label="Supprimer tout"><svg class="gi"><use href="#i-trash"/></svg></button>
  </div>
  <div class="galleryInfo">
    <span><b id="vaultLabel">Coffre</b> · <span id="mediaCount">0 élément</span></span>
    <div class="selectTools">
      <button id="selectAllBtn" class="selectAllBtn">Tout sélectionner</button>
      <button id="clearSelectionBtn" class="selectAllBtn">Désélectionner tout</button>
    </div>
  </div>
  <div id="grid" class="grid"></div>
  <div id="actionBar" class="actionBar">
    <div id="selectedCount" class="selectedCount">0 sélection</div>
    <div class="actions">
      <button id="deleteSelectedBtn" class="actionBtn danger">Supprimer</button>
      <button id="lockSelectedBtn" class="actionBtn">Verrouiller</button>
      <button id="exportSelectedBtn" class="actionBtn">Exporter</button>
    </div>
  </div>
  <div id="status"><div class="msg" id="statusMsg"></div><div class="bar"><i id="statusBar"></i></div></div>
  <button id="addBtn" class="fab">＋ Ajouter</button>
  <input id="file" type="file" accept="image/*,video/*,.pdf,.zip,.txt,.doc,.docx,.xls,.xlsx,.ppt,.pptx,application/pdf,application/zip" multiple class="hidden">
</section>

<div id="confirmShade" class="modalShade">
  <div class="modal">
    <div class="modalTitle">Confirmation</div>
    <div id="confirmText" class="modalText"></div>
    <div class="modalBtns">
      <button id="confirmCancel" class="modalBtn">Annuler</button>
      <button id="confirmOk" class="modalBtn danger">Supprimer</button>
    </div>
  </div>
</div>

<section id="viewer">
  <div class="vhead">
    <button id="vClose" class="vbtn">‹ Retour</button>
    <span id="vCount" class="counter"></span>
    <span style="width:64px"></span>
  </div>
  <button id="vPrev" class="vnav prev">‹</button>
  <div id="vStage" class="vstage"></div>
  <button id="vNext" class="vnav next">›</button>
  <div class="vfoot"><button id="vDel" class="vbtn del">Supprimer</button></div>
</section>

<script src="app-logger.js"></script>
<script src="vault-core.js"></script>
<script>
/* ===== Galerie moderne : grille rapide, sélection multiple, suppression réelle ===== */
const Store = (() => {
  const DB=VaultCore.dbName('gallery'), ITEMS='items', CHUNKS='chunks', CHUNK=4*1024*1024;
  let _urls=new Set();
  function db(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,2);
    r.onupgradeneeded=()=>{const d=r.result;
      if(!d.objectStoreNames.contains(ITEMS))d.createObjectStore(ITEMS,{keyPath:'id'});
      if(!d.objectStoreNames.contains(CHUNKS))d.createObjectStore(CHUNKS,{keyPath:'k'});};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
  const st=(s,m)=>db().then(d=>d.transaction(s,m).objectStore(s));
  const get=(s,k)=>st(s,'readonly').then(o=>new Promise((res,rej)=>{const q=o.get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}));
  const put=(s,v)=>st(s,'readwrite').then(o=>new Promise((res,rej)=>{const q=o.put(v);q.onsuccess=()=>res();q.onerror=()=>rej(q.error);}));
  const del=(s,k)=>st(s,'readwrite').then(o=>new Promise((res,rej)=>{const q=o.delete(k);q.onsuccess=()=>res();q.onerror=()=>rej(q.error);}));
  const clear=s=>st(s,'readwrite').then(o=>new Promise((res,rej)=>{const q=o.clear();q.onsuccess=()=>res();q.onerror=()=>rej(q.error);}));
  const all=s=>st(s,'readonly').then(o=>new Promise((res,rej)=>{const q=o.getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}));
  async function add(file,onProgress){
    const id=Date.now()+'_'+Math.random().toString(36).slice(2);
    const total=Math.max(1,Math.ceil(file.size/CHUNK));
    try{for(let seq=0;seq<total;seq++){const buf=await file.slice(seq*CHUNK,Math.min(file.size,(seq+1)*CHUNK)).arrayBuffer();const enc=await VaultCore.encrypt(buf);await put(CHUNKS,{k:id+':'+seq,iv:enc.iv,data:enc.data,encrypted:true});if(onProgress)onProgress((seq+1)/total);}await put(ITEMS,{id,name:file.name,type:file.type||guessMime(file.name),size:file.size,chunks:total});return id;}
    catch(e){for(let seq=0;seq<total;seq++){try{await del(CHUNKS,id+':'+seq);}catch(_){}}throw e;}
  }
  async function list(){return (await all(ITEMS)).sort((a,b)=>a.id<b.id?1:-1).map(r=>({id:r.id,type:r.type,name:r.name,size:r.size,chunks:r.chunks,thumb:r.thumb||'',source:'idb',key:'idb:'+r.id}));}
  async function setThumb(id,thumb){const it=await get(ITEMS,id);if(!it)return;it.thumb=thumb;await put(ITEMS,it);}
  async function meta(id){const it=await get(ITEMS,id);if(!it)throw new Error('Introuvable.');return it;}
  async function chunk(id,seq){const c=await get(CHUNKS,id+':'+seq);if(!c)throw new Error('Morceau manquant.');return c.encrypted?await VaultCore.decrypt(c):c.data;}
  async function url(id){const it=await get(ITEMS,id);if(!it)throw new Error('Introuvable.');const parts=[];for(let seq=0;seq<it.chunks;seq++){const c=await get(CHUNKS,id+':'+seq);if(!c)throw new Error('Morceau manquant.');parts.push(new Uint8Array(c.encrypted?await VaultCore.decrypt(c):c.data));}const u=URL.createObjectURL(new Blob(parts,{type:it.type||guessMime(it.name)}));_urls.add(u);return u;}
  function revoke(u){try{URL.revokeObjectURL(u);}catch(e){}_urls.delete(u);}
  async function remove(id){const it=await get(ITEMS,id);if(it)for(let seq=0;seq<it.chunks;seq++){try{await del(CHUNKS,id+':'+seq);}catch(_){}}return del(ITEMS,id);}
  async function wipeAll(){for(const u of Array.from(_urls))revoke(u);try{await clear(CHUNKS);}catch(_){}try{await clear(ITEMS);}catch(_){} }
  return {add,list,meta,chunk,url,revoke,remove,setThumb,wipeAll};
})();

const $=id=>document.getElementById(id);
let items=[], allMedia=[], viewIndex=-1, curUrl=null, selected=new Set(), observer=null;
function guessMime(name){const n=(name||'').toLowerCase();if(/\.(jpg|jpeg|png|gif|webp|bmp|heic)$/.test(n))return 'image/*';if(/\.(mp4|mov|m4v|webm|mkv|avi|3gp|ts|m2ts)$/.test(n))return 'video/*';if(n.endsWith('.pdf'))return 'application/pdf';if(n.endsWith('.zip'))return 'application/zip';return 'application/octet-stream';}
function isVideo(it){return (it.type||'').startsWith('video')||/\.(mp4|mov|m4v|webm|mkv|avi|3gp|ts|m2ts)$/i.test(it.name||'');}
function isImage(it){return (it.type||'').startsWith('image')||/\.(jpg|jpeg|png|gif|webp|bmp|heic)$/i.test(it.name||'');}
function ext(name){const m=String(name||'').match(/\.([a-z0-9]{1,5})$/i);return m?m[1].toUpperCase():'DOC';}
function hasVault(){return !!(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Vault);}
function hasNativeVideo(){return !!(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.NativeVideo);}
function abToBase64(buf){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(new Blob([buf]));});}
function base64ToArrayBuffer(b64){const bin=atob(b64);const len=bin.length;const bytes=new Uint8Array(len);for(let i=0;i<len;i++)bytes[i]=bin.charCodeAt(i);return bytes.buffer;}
function escapeHtml(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function plural(n){return n+' élément'+(n>1?'s':'');}
function status(msg,frac,isErr){const box=$('status');box.classList.add('on');const m=$('statusMsg');m.textContent=msg;m.className='msg'+(isErr?' error':'');$('statusBar').style.width=Math.round((frac||0)*100)+'%';}
function statusHide(delay){setTimeout(()=>$('status').classList.remove('on'),delay||0);}
function confirmBox(text){return new Promise(res=>{const sh=$('confirmShade');$('confirmText').textContent=text;sh.classList.add('on');const done=v=>{sh.classList.remove('on');$('confirmOk').onclick=null;$('confirmCancel').onclick=null;res(v);};$('confirmOk').onclick=()=>done(true);$('confirmCancel').onclick=()=>done(false);});}
function updateSelectionUI(){const n=selected.size;$('selectedCount').textContent=n+' sélectionné'+(n>1?'s':'');$('actionBar').classList.toggle('on',n>0);document.querySelectorAll('.cell[data-key]').forEach(c=>{const on=selected.has(c.dataset.key);c.classList.toggle('selected',on);const b=c.querySelector('.check');if(b)b.textContent=on?'✓':'';});}
function toggleSelect(key){if(selected.has(key))selected.delete(key);else selected.add(key);updateSelectionUI();}
function selectAll(){allMedia.forEach(m=>selected.add(m.key));updateSelectionUI();}
function clearSelection(){selected.clear();updateSelectionUI();}

async function generateNativeThumb(id){
  if(!hasNativeVideo())return;
  const NativeVideo=window.Capacitor.Plugins.NativeVideo, meta=await Store.meta(id);
  const start=await NativeVideo.startSession({name:meta.name||'video',mime:meta.type||'video/mp4'});
  const sessionId=start.sessionId;
  for(let seq=0;seq<meta.chunks;seq++){await NativeVideo.appendChunk({sessionId,base64:await abToBase64(await Store.chunk(id,seq))});}
  const out=await NativeVideo.finishThumbnail({sessionId});
  if(out&&out.thumbnail)await Store.setThumb(id,'data:image/jpeg;base64,'+out.thumbnail);
}

function makeCell(media,idx){
  const cell=document.createElement('div');cell.className='cell';cell.dataset.key=media.key;cell.style.animationDelay=(Math.min(idx,12)*18)+'ms';
  cell.innerHTML='<button class="check" aria-label="Sélectionner">'+(selected.has(media.key)?'✓':'')+'</button><div class="vthumb"><div class="nm">Chargement…</div></div>';
  cell.querySelector('.check').onclick=ev=>{ev.stopPropagation();toggleSelect(media.key);};
  cell.oncontextmenu=ev=>{ev.preventDefault();toggleSelect(media.key);};
  cell.onclick=()=>{ if(selected.size){toggleSelect(media.key);return;} openMedia(media); };
  if(observer)observer.observe(cell);
  return cell;
}
function renderCellContent(cell,media){
  if(cell.dataset.loaded)return; cell.dataset.loaded='1';
  const badge='<div class="typeBadge">'+(isVideo(media)?'VIDÉO':isImage(media)?'IMAGE':ext(media.name))+'</div>';
  if(isVideo(media)){
    const thumb=media.thumb?'<img loading="lazy" src="'+media.thumb+'" alt="">':'';
    cell.innerHTML='<button class="check" aria-label="Sélectionner">✓</button><div class="vthumb">'+thumb+'<div class="play">▶</div><div class="nm">'+escapeHtml(media.name||'vidéo')+'</div></div>'+badge;
  }else if(isImage(media)){
    if(media.source==='vault' && media.thumb){cell.innerHTML='<button class="check" aria-label="Sélectionner">✓</button><img loading="lazy" decoding="async" src="'+media.thumb+'" alt="">'+badge;}
    else Store.url(media.id).then(u=>{cell.dataset.url=u;cell.innerHTML='<button class="check" aria-label="Sélectionner">✓</button><img loading="lazy" decoding="async" src="'+u+'" alt="">'+badge;updateSelectionUI();}).catch(()=>{cell.innerHTML='<button class="check">✓</button><div class="docThumb"><div class="docIcon">□</div><div class="nm">Illisible</div></div>';});
  }else{
    cell.innerHTML='<button class="check" aria-label="Sélectionner">✓</button><div class="docThumb"><div class="docIcon">▣</div><div class="docExt">'+ext(media.name)+'</div><div class="nm">'+escapeHtml(media.name||'document')+'</div></div>'+badge;
  }
  cell.querySelector('.check').onclick=ev=>{ev.stopPropagation();toggleSelect(media.key);};
  updateSelectionUI();
}

async function renderGrid(){
  const g=$('grid'); g.innerHTML=''; clearSelection();
  if(observer)observer.disconnect();
  observer=new IntersectionObserver(entries=>{entries.forEach(en=>{if(en.isIntersecting){observer.unobserve(en.target);const m=allMedia.find(x=>x.key===en.target.dataset.key);if(m)renderCellContent(en.target,m);}});},{root:g,rootMargin:'450px 0px',threshold:.01});
  let vault=[];
  if(hasVault()){try{const r=await window.Capacitor.Plugins.Vault.listVaultVideos({vault:VaultCore.current()});vault=((r&&r.items)||[]).map(v=>({source:'vault',key:'vault:'+VaultCore.current()+':'+v.id,id:v.id,name:v.name||'vidéo',type:v.type||'video/mp4',thumb:v.thumb||'',size:v.size||0}));}catch(_){}}
  try{items=await Store.list();}catch(e){status('Erreur de lecture : '+e.message,1,true);items=[];}
  allMedia=[...vault,...items]; $('mediaCount').textContent=plural(allMedia.length);
  if(!allMedia.length){g.innerHTML='<div class="empty"><div class="big">Galerie vide</div><div>Touche « Ajouter » pour importer images, vidéos, documents ou ZIP.</div></div>';return;}
  const frag=document.createDocumentFragment(); allMedia.forEach((m,i)=>frag.appendChild(makeCell(m,i))); g.appendChild(frag);
}

async function deleteMedia(media){
  if(media.source==='vault'&&hasVault())return window.Capacitor.Plugins.Vault.deleteVaultVideo({id:media.id,vault:VaultCore.current()});
  return Store.remove(media.id);
}
async function deleteSelected(){
  const targets=allMedia.filter(m=>selected.has(m.key)); if(!targets.length)return;
  if(!await confirmBox('Supprimer définitivement '+plural(targets.length)+' ?'))return;
  await deleteMany(targets);
}
async function deleteAll(){
  const count=allMedia.length; if(!count)return status('La galerie est déjà vide.',1);
  if(!await confirmBox('Supprimer définitivement '+plural(count)+' ?'))return;
  await deleteMany(allMedia,true);
}
async function deleteMany(targets,all){
  closeViewer(); let done=0;
  try{
    status('Suppression…',0);
    if(all){
      if(hasVault()){try{await window.Capacitor.Plugins.Vault.wipeVault({vault:VaultCore.current()});}catch(_){for(const m of targets.filter(x=>x.source==='vault')){try{await deleteMedia(m);}catch(_){}}}}
      if(hasNativeVideo()&&window.Capacitor.Plugins.NativeVideo.wipeNativeCache){try{await window.Capacitor.Plugins.NativeVideo.wipeNativeCache();}catch(_){}}
      await Store.wipeAll(); done=targets.length;
    }else{
      for(const m of targets){await deleteMedia(m);done++;status('Suppression '+done+'/'+targets.length,done/targets.length);}
    }
    clearSelection(); $('vaultLabel').textContent=VaultCore.label();
await renderGrid(); status('Suppression terminée : '+plural(done)+' supprimé'+(done>1?'s':'')+'.',1); statusHide(1800);
  }catch(e){status('Erreur suppression : '+(e&&e.message?e.message:e),1,true);$('vaultLabel').textContent=VaultCore.label();
await renderGrid();}
}

async function exportSelected(){
  const n=selected.size; if(!n)return;
  status('Export : fonction prête côté interface. Utilise le partage Android si le plugin est ajouté au projet.',1); statusHide(2600);
}

async function openMedia(media){
  if(media.source==='vault'){
    try{await suspendLock();await window.Capacitor.Plugins.Vault.playVaultVideo({id:media.id,vault:VaultCore.current()});}
    catch(e){await resumeLock();status('Lecture impossible : '+(e&&e.message?e.message:e),1,true);} return;
  }
  const idx=items.findIndex(x=>x.id===media.id); if(idx<0)return; viewIndex=idx; $('viewer').classList.add('on'); await showMedia();
}
let zoom=1,panX=0,panY=0;
async function playNativeVideo(it,stage){
  const NativeVideo=window.Capacitor.Plugins.NativeVideo, meta=await Store.meta(it.id);
  const start=await NativeVideo.startSession({name:meta.name||'video',mime:meta.type||'video/mp4'}), sessionId=start.sessionId;
  for(let seq=0;seq<meta.chunks;seq++){await NativeVideo.appendChunk({sessionId,base64:await abToBase64(await Store.chunk(it.id,seq))});stage.innerHTML='<div class="vloading">Préparation vidéo native… '+Math.round(((seq+1)/meta.chunks)*100)+'%</div>';}
  await suspendLock(); await NativeVideo.finishAndPlay({sessionId,title:meta.name||'Vidéo'}); stage.innerHTML='<div class="vloading">Lecture ouverte avec le lecteur Android natif.<br><br>Reviens ici avec le bouton retour.</div>';
}
async function showMedia(){
  const stage=$('vStage'); if(curUrl){Store.revoke(curUrl);curUrl=null;} stage.innerHTML='<div class="vloading">Chargement…</div>'; zoom=1;panX=panY=0;
  const it=items[viewIndex]; $('vCount').textContent=(viewIndex+1)+' / '+items.length;
  try{
    if(isVideo(it)&&hasNativeVideo()){await playNativeVideo(it,stage);return;}
    curUrl=await Store.url(it.id); stage.innerHTML=''; let el;
    if(isVideo(it)){el=document.createElement('video');el.src=curUrl;el.controls=true;el.autoplay=true;el.playsInline=true;el.onerror=()=>{stage.innerHTML='<div class="vloading">Vidéo non lisible par la WebView Android.<br>Codec/conteneur probablement non supporté.</div>';};}
    else if(isImage(it)){el=document.createElement('img');el.src=curUrl;el.id='vImg';el.addEventListener('dblclick',toggleZoom);el.addEventListener('pointerdown',startPan);}
    else {stage.innerHTML='<div class="vloading">Document stocké : '+escapeHtml(it.name)+'<br>Il peut être supprimé avec la sélection multiple.</div>';return;}
    stage.appendChild(el);
  }catch(e){stage.innerHTML='<div class="vloading">Erreur : '+(e&&e.message?e.message:e)+'</div>';}
}
function applyTransform(){const im=$('vImg');if(im)im.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;}
function toggleZoom(){zoom=zoom>1?1:2.4;panX=panY=0;applyTransform();}
let panning=false,sx=0,sy=0;
function startPan(e){if(zoom<=1)return;panning=true;sx=e.clientX-panX;sy=e.clientY-panY;e.target.setPointerCapture(e.pointerId);}
$('vStage').addEventListener('pointermove',e=>{if(panning){panX=e.clientX-sx;panY=e.clientY-sy;applyTransform();}});
$('vStage').addEventListener('pointerup',()=>panning=false);
function closeViewer(){$('viewer').classList.remove('on');if(curUrl){Store.revoke(curUrl);curUrl=null;}$('vStage').innerHTML='';}
$('vClose').onclick=closeViewer;$('vPrev').onclick=()=>nav(-1);$('vNext').onclick=()=>nav(1);
function nav(d){if(zoom>1)return;const n=viewIndex+d;if(n<0||n>=items.length)return;viewIndex=n;showMedia();}
$('vDel').onclick=async()=>{const it=items[viewIndex];if(!it)return;if(await confirmBox('Supprimer définitivement 1 élément ?')){await Store.remove(it.id);closeViewer();$('vaultLabel').textContent=VaultCore.label();
await renderGrid();status('Élément supprimé.',1);statusHide(1300);}};
let tsx=0,tsy=0;
$('vStage').addEventListener('touchstart',e=>{if(e.touches.length===1){tsx=e.touches[0].clientX;tsy=e.touches[0].clientY;}},{passive:true});
$('vStage').addEventListener('touchend',e=>{if(zoom>1)return;const dx=e.changedTouches[0].clientX-tsx,dy=e.changedTouches[0].clientY-tsy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy))nav(dx<0?1:-1);else if(dy>90&&Math.abs(dy)>Math.abs(dx))closeViewer();},{passive:true});
document.addEventListener('keydown',e=>{if(!$('viewer').classList.contains('on'))return;if(e.key==='ArrowLeft')nav(-1);if(e.key==='ArrowRight')nav(1);if(e.key==='Escape')closeViewer();});

$('addBtn').onclick=async()=>{await suspendLock();$('file').click();};
$('file').onchange=async e=>{const files=[...e.target.files];e.target.value='';if(!files.length){await resumeLock();return;}let i=0;for(const f of files){i++;try{status(`Ajout ${i}/${files.length} — ${f.name}`,0);const id=await Store.add(f,frac=>status(`Ajout ${i}/${files.length} — ${f.name}`,frac));if(isVideo({name:f.name,type:f.type})){try{status('Création miniature vidéo…',1);await generateNativeThumb(id);}catch(_){}}}catch(err){status(`Échec sur ${f.name} : ${err&&err.message?err.message:err}`,1,true);statusHide(6000);$('vaultLabel').textContent=VaultCore.label();
await renderGrid();await resumeLock();return;}}status('Ajout terminé.',1);statusHide(1200);$('vaultLabel').textContent=VaultCore.label();
await renderGrid();await resumeLock();};
$('selectAllBtn').onclick=selectAll;$('clearSelectionBtn').onclick=clearSelection;$('deleteSelectedBtn').onclick=deleteSelected;$('wipeBtn').onclick=deleteAll;$('exportSelectedBtn').onclick=exportSelected;$('lockSelectedBtn').onclick=()=>lockNow();
$('browserBtn').onclick=async()=>{if(!hasVault()){status('Navigateur disponible seulement dans l’APK compilé.',1,true);statusHide(3000);return;}try{await suspendLock();await window.Capacitor.Plugins.Vault.openBrowser({vault:VaultCore.current()});}catch(e){await resumeLock();status('Impossible d’ouvrir le navigateur : '+(e&&e.message?e.message:e),1,true);}};
$('homeBtn').onclick=async()=>{await suspendLock();AppLogger?.nav('home.html','gallery home button');location.href='home.html';};

window.__suspendLock=false;
async function suspendLock(){window.__suspendLock=true;try{await (window.Capacitor?.Plugins?.LockControl?.suspend());}catch(_){}}
async function resumeLock(){window.__suspendLock=false;try{await (window.Capacitor?.Plugins?.LockControl?.resume());}catch(_){}}
function lockNow(){window.__suspendLock=false;AppLogger?.nav('index.html','gallery lockNow user/manual');try{window.Capacitor?.Plugins?.LockControl?.resume();}catch(e){AppLogger?.error('GALLERY_LOCK_RESUME_ERROR',e)}location.replace('index.html');}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(!window.__suspendLock){AppLogger?.nav('index.html','gallery visibilitychange hidden suspendLock=false');location.replace('index.html');}else{AppLogger?.event('GALLERY_LOCK_SKIP',{reason:'visibilitychange hidden but suspended'});}}else{window.__suspendLock=false;AppLogger?.event('GALLERY_VISIBLE_AGAIN',{});try{window.Capacitor?.Plugins?.LockControl?.resume();}catch(e){AppLogger?.error('GALLERY_RESUME_VISIBLE_ERROR',e)}}});
window.addEventListener('pagehide',(e)=>{if(!window.__suspendLock){AppLogger?.nav('index.html','gallery pagehide persisted='+!!e.persisted+' suspendLock=false');location.replace('index.html');}else{AppLogger?.event('GALLERY_LOCK_SKIP',{reason:'pagehide but suspended',persisted:!!e.persisted});}});
function refreshCameraButton(){}
$('vaultLabel').textContent=VaultCore.label();
renderGrid();
</script>
<script src="camera-indicator.js"></script>
</body>
</html>
