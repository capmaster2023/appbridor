<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Caméra</title>
<style>
  :root{--ink:#0b0d12;--panel:#161922;--panel2:#1E222D;--line:rgba(255,255,255,.08);--mist:#8B93A4;--paper:#ECEEF3;--brass:#C9A24B;--brass-soft:#e2c074;--danger:#E0564B;--ok:#54d18a;--serif:Georgia,"Times New Roman",serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;font-family:var(--sans);overflow:hidden;overscroll-behavior:none;color:var(--paper);background:#0b0d12;background-image:radial-gradient(110% 70% at 16% -6%,rgba(86,102,170,.26),transparent 52%),radial-gradient(120% 75% at 92% 110%,rgba(201,162,75,.16),transparent 48%),linear-gradient(180deg,#1a2030 0%,#11141c 46%,#0b0d12 100%)}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}.hidden{display:none!important}.wrap{position:fixed;inset:0;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));gap:14px}
  .topbar{display:flex;align-items:center;justify-content:space-between}.back{width:44px;height:44px;border-radius:16px;background:rgba(20,24,33,.72);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 12px 28px rgba(0,0,0,.25);font-size:24px}.tag{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--brass);font-weight:900}.hero{padding:10px 4px 2px;text-align:center}.hero h1{font-family:var(--serif);font-size:clamp(34px,10vw,48px);font-weight:600;margin:0;letter-spacing:.01em}.hero p{margin:10px auto 0;color:var(--mist);font-size:14px;line-height:1.45;max-width:520px}
  .panel{background:linear-gradient(180deg,#1a2030,#141926);border:1px solid var(--line);border-radius:28px;padding:16px;box-shadow:0 30px 70px rgba(0,0,0,.46);overflow:auto;min-height:0}.state{min-height:76px;border-radius:22px;background:#0c0f18;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mist);padding:14px;line-height:1.35;font-weight:800}.state.on{color:#ffc0bb;border-color:rgba(224,86,75,.58);background:rgba(224,86,75,.10)}.state.done{color:#b8ffd2;border-color:rgba(84,209,138,.52);background:rgba(84,209,138,.10)}
  .grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px}.camBtn{min-height:62px;border-radius:19px;background:linear-gradient(165deg,rgba(226,192,116,.98),rgba(201,162,75,.98));color:#1a1407;font-size:16px;font-weight:900;box-shadow:0 12px 28px rgba(201,162,75,.22),inset 0 1px 0 rgba(255,255,255,.35)}.camBtn.secondary{background:#262b38;color:#dfe3ec;border:1px solid var(--line);box-shadow:0 12px 28px rgba(0,0,0,.22)}.camBtn.stop{background:rgba(224,86,75,.18);border:1px solid rgba(224,86,75,.62);color:#ffc0bb;box-shadow:none}.camBtn:active,.back:active{transform:scale(.98)}.note{margin-top:14px;color:var(--mist);font-size:12.5px;line-height:1.45;text-align:center}.duoStage{margin-top:14px;height:min(47vh,520px);background:#050609;border:1px solid var(--line);border-radius:24px;overflow:hidden;display:none}.duoStage.on{display:block}.duoStage canvas{width:100%;height:100%;object-fit:cover;display:block}.mini{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0}.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(20,24,34,.96);color:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 18px;z-index:99;display:none;max-width:90%;text-align:center;box-shadow:0 14px 34px rgba(0,0,0,.5)}.toast.on{display:block}@media(min-width:700px){.wrap{align-items:center}.topbar,.hero,.panel{width:min(620px,100%)}.grid{grid-template-columns:1fr 1fr}.camBtn.stop{grid-column:1/-1}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><button class="back" id="backBtn" aria-label="Retour">‹</button><div class="tag">Espace privé</div><div style="width:44px"></div></div>
  <div class="hero"><h1>Caméra</h1><p>Enregistre avec la caméra arrière, frontale ou le mode duo, avec le même style que l’app calculatrice.</p></div>
  <div class="panel">
    <div id="state" class="state">Choisis un mode d’enregistrement.</div>
    <div id="duoStage" class="duoStage"><canvas id="duoCanvas" width="720" height="1280"></canvas></div>
    <video id="backVideo" class="mini" muted playsinline></video><video id="frontVideo" class="mini" muted playsinline></video>
    <div class="grid">
      <button class="camBtn" data-mode="back">Caméra arrière + son</button>
      <button class="camBtn secondary" data-mode="front">Caméra frontale + son</button>
      <button class="camBtn secondary" data-mode="dual">Duo caméra</button>
      <button class="camBtn stop hidden" id="stopBtn">Arrêter et sauvegarder</button>
    </div>
    <div class="note">Dans l’APK Android, l’enregistrement utilise un service caméra natif avec indicateur bleu visible. Le mode duo dépend du téléphone.</div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="app-logger.js"></script>
<script src="vault-core.js"></script>
<script>
const $=id=>document.getElementById(id);const P=()=>window.Capacitor?.Plugins||{};let recording=false,modeNow='back';let dual={streams:[],rec:null,chunks:[],raf:0};function plugin(){return P().CameraRecorder}function toast(t){$('toast').textContent=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),2200)}
function currentVault(){try{return window.VaultCore?.current?.()||localStorage.getItem('active_vault_v1')||sessionStorage.getItem('active_vault_v1')||'main'}catch(_){return 'main'}}
async function suspendLock(){try{localStorage.setItem('CAMERA_PERMISSION_ACTIVE','1');await P().LockControl?.suspend?.();AppLogger?.event('LOCK_SUSPEND',{reason:'camera'})}catch(e){AppLogger?.error('LOCK_SUSPEND_CAMERA_ERROR',e?.message||e)}}
async function resumeLock(){try{localStorage.removeItem('CAMERA_PERMISSION_ACTIVE');await P().LockControl?.resume?.();AppLogger?.event('LOCK_RESUME',{reason:'camera'})}catch(e){AppLogger?.error('LOCK_RESUME_CAMERA_ERROR',e?.message||e)}}
function goHome(){window.__suspendLock=true;try{P().LockControl?.suspend?.()}catch(_){}location.href='home.html'}$('backBtn').onclick=goHome;
function setState(txt,type='normal'){const s=$('state');s.textContent=txt;s.classList.toggle('on',type==='recording');s.classList.toggle('done',type==='done')}function label(m){return m==='front'?'caméra frontale':(m==='dual'?'duo caméra':'caméra arrière')}function updateUI(){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('hidden',recording));$('stopBtn').classList.toggle('hidden',!recording);$('duoStage').classList.toggle('on',recording&&modeNow==='dual'&&!plugin())}
async function refresh(){try{if(plugin()){const r=await plugin().isRecording();recording=!!r.recording;modeNow=r.mode||modeNow;if(recording){window.CameraIndicator?.show?.();setState('📹 Enregistrement en cours : '+label(modeNow),'recording')}else{window.CameraIndicator?.hide?.();}}}catch(_){}updateUI()}
async function start(mode){AppLogger?.event('CAMERA_START_CLICK',{mode});modeNow=mode;if(mode==='dual')return startDual();if(!plugin()){toast('Disponible dans l’APK Android compilé.');return}try{await suspendLock();await plugin().start({mode,audio:true,vault:currentVault()});recording=true;window.CameraIndicator?.show?.();setState('📹 Enregistrement en cours : '+label(mode),'recording');updateUI()}catch(e){await resumeLock();toast('Erreur caméra : '+(e?.message||e))}}
async function stop(){AppLogger?.event('CAMERA_STOP_CLICK',{mode:modeNow});if(modeNow==='dual'&&!plugin())return stopDual();if(!plugin())return;try{await plugin().stop();await resumeLock();recording=false;window.CameraIndicator?.hide?.();setState('✅ Vidéo sauvegardée.','done');updateUI()}catch(e){toast('Erreur arrêt caméra : '+(e?.message||e))}}
async function startDual(){if(plugin()){try{await suspendLock();await plugin().start({mode:'dual',audio:true,vault:currentVault()});recording=true;modeNow='dual';window.CameraIndicator?.show?.();setState('📹 Duo caméra en cours','recording');updateUI()}catch(e){await resumeLock();toast('Erreur duo caméra : '+(e?.message||e))}return}if(!navigator.mediaDevices?.getUserMedia){toast('Duo indisponible sur cette WebView.');return}try{await suspendLock();const back=await getCam('environment');const front=await getCam('user');let audio=null;try{audio=await navigator.mediaDevices.getUserMedia({audio:true,video:false})}catch(_){}dual.streams=[back,front].concat(audio?[audio]:[]);$('backVideo').srcObject=back;$('frontVideo').srcObject=front;await $('backVideo').play();await $('frontVideo').play();const c=$('duoCanvas'),ctx=c.getContext('2d');function draw(){ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);drawCover(ctx,$('backVideo'),0,0,c.width,c.height/2);drawCover(ctx,$('frontVideo'),0,c.height/2,c.width,c.height/2);dual.raf=requestAnimationFrame(draw)}draw();const stream=c.captureStream(30);if(audio)audio.getAudioTracks().forEach(t=>stream.addTrack(t));dual.chunks=[];dual.rec=new MediaRecorder(stream);dual.rec.ondataavailable=e=>{if(e.data&&e.data.size)dual.chunks.push(e.data)};dual.rec.start(1000);recording=true;modeNow='dual';window.CameraIndicator?.show?.();setState('📹 Duo caméra en cours','recording');updateUI()}catch(e){cleanupDual();await resumeLock();toast('Duo impossible : '+(e?.message||e))}}
async function getCam(facing){return navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:facing},width:{ideal:1280},height:{ideal:720}},audio:false}).catch(()=>navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false}))}function drawCover(ctx,v,x,y,w,h){if(!v.videoWidth)return;const sw=v.videoWidth,sh=v.videoHeight,scale=Math.max(w/sw,h/sh),nw=sw*scale,nh=sh*scale;ctx.drawImage(v,x+(w-nw)/2,y+(h-nh)/2,nw,nh)}
async function stopDual(){try{if(dual.rec&&dual.rec.state!=='inactive'){await new Promise(res=>{dual.rec.onstop=res;dual.rec.stop()})}cleanupDual();await resumeLock();recording=false;window.CameraIndicator?.hide?.();setState('✅ Duo arrêté.','done');updateUI()}catch(e){cleanupDual();recording=false;window.CameraIndicator?.hide?.();updateUI();toast('Erreur arrêt duo : '+(e?.message||e))}}function cleanupDual(){try{cancelAnimationFrame(dual.raf)}catch(_){}try{dual.streams.forEach(s=>s.getTracks().forEach(t=>t.stop()))}catch(_){}dual={streams:[],rec:null,chunks:[],raf:0};$('backVideo').srcObject=null;$('frontVideo').srcObject=null}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(b.dataset.mode));$('stopBtn').onclick=stop;refresh();
</script>
<script src="camera-indicator.js"></script>
</body>
</html>
