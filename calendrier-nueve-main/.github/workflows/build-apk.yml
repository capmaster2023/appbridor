name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Apply Android customizations
        run: |
          chmod +x scripts/apply_android_customizations.sh
          bash scripts/apply_android_customizations.sh

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calendrier-apk
          path: android/app/build/outputs/apk/**/*.apk
